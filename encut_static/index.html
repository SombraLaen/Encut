<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encut</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="toolbar">
        <span class="logo">Encut <span id="version"></span></span>
        <span class="status" id="status">Selecione um ou mais vídeos para começar.</span>
    </header>

    <main>
        <section class="card">
            <h2>Entrada</h2>
            <div class="file-section">
                <button id="pick-files" class="btn">+ Adicionar vídeos</button>
                <button id="clear-files" class="btn btn-ghost">Limpar</button>
                <input type="file" id="file-input" multiple accept="video/*" hidden>
            </div>
            <ul id="file-list" class="file-list"></ul>
            <div class="field">
                <label>Saída</label>
                <input type="text" id="output-path" placeholder="Pasta de destino ou arquivo .mp4">
                <button id="pick-output" class="btn btn-small">Escolher</button>
            </div>
        </section>

        <section class="card">
            <h2>Corte</h2>
            <div class="grid">
                <div class="field">
                    <label>Silêncio abaixo de (dB) <span class="help" title="Volume abaixo do qual o áudio é considerado silêncio. Valores mais altos cortam mais facilmente.">?</span></label>
                    <input type="number" id="threshold" value="-35" step="1">
                </div>
                <div class="field">
                    <label>Silêncio mínimo (s) <span class="help" title="Tempo mínimo que o áudio precisa ficar abaixo do limite para virar um corte.">?</span></label>
                    <input type="number" id="min-silence" value="0.45" step="0.05" min="0">
                </div>
                <div class="field">
                    <label>Margem (s) <span class="help" title="Margem preservada antes e depois de cada fala.">?</span></label>
                    <input type="number" id="padding" value="0.12" step="0.01" min="0">
                </div>
            </div>
        </section>

        <section class="card">
            <h2>Exportação</h2>
            <div class="radio-group">
                <label><input type="radio" name="mode" value="reencode" checked> <span>Preciso</span></label>
                <label><input type="radio" name="mode" value="copy"> <span>Rápido</span></label>
            </div>
        </section>

        <section class="card">
            <h2>Detecção</h2>
            <div class="radio-group">
                <label><input type="radio" name="detection" value="speech" checked> <span>Fala precisa</span></label>
                <label><input type="radio" name="detection" value="silence"> <span>Silêncio tradicional</span></label>
                <label><input type="radio" name="detection" value="video_use"> <span>Video Use</span></label>
            </div>
        </section>

        <section class="card">
            <h2>Preset</h2>
            <div class="preset-row">
                <select id="preset-select"></select>
                <button id="load-preset" class="btn btn-small">Carregar</button>
            </div>
        </section>

        <div class="actions">
            <button id="start-btn" class="btn btn-primary">Cortar silêncio</button>
            <button id="cancel-btn" class="btn btn-danger" disabled>Cancelar</button>
            <button id="clear-log" class="btn btn-ghost">Limpar log</button>
        </div>

        <div class="progress-container">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <span class="progress-label" id="progress-label"></span>
        </div>

        <section class="card log-card">
            <h2>Log</h2>
            <pre id="log" class="log"></pre>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
